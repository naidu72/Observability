# Migrated into GitOps 2026-08-18 after a cluster restore silently
# reverted a manually-created ServiceAccount, which caused repeated
# FailedCreate errors and a KubeDeploymentReplicasMismatch alert loop
# in Discord. Anything created by hand outside git is exactly what a
# restore/rollback will wipe out — this file is the fix.

---
# Before applying: write the real auth key into Vault —
#   vault kv put kv/homelab/tailscale ts_authkey=<your real tailscale auth key>
# No Vault policy change needed — eso-policy already grants
# read access to kv/data/homelab/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth-key
  namespace: homelab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: tailscale-auth-key
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: homelab/tailscale
        property: ts_authkey
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-subnet-router
  namespace: homelab
---
# Tailscale's Kubernetes operator mode auto-detects it's running in a
# Pod and tries to read/write a Secret named "tailscale" for state,
# even with TS_USERSPACE=1 + TS_STATE_DIR set. Without this RBAC the
# container crash-loops on startup with:
#   "missing get permission on secret \"tailscale\""
#   "missing update permission on secret \"tailscale\""
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-subnet-router
  namespace: homelab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-subnet-router
  namespace: homelab
subjects:
  - kind: ServiceAccount
    name: tailscale-subnet-router
    namespace: homelab
roleRef:
  kind: Role
  name: tailscale-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: tailscale-subnet-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      serviceAccountName: tailscale-subnet-router
      terminationGracePeriodSeconds: 30
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: Always
          env:
            - name: TS_EXTRA_ARGS
              value: --advertise-routes=10.42.0.0/16,10.43.0.0/16,192.168.0.0/24 --accept-dns=false
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_USERSPACE
              value: "1"
          envFrom:
            - secretRef:
                name: tailscale-auth-key
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: state
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler

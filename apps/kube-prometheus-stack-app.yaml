apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1 # pin explicitly; bump deliberately, not via automation
      helm:
        valueFiles:
          - $values/charts/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/naidu72/Observability.git
      targetRevision: main
      ref: values
  destination:
    server: https://k8spi.naidu72.info
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
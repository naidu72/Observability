# Applied by the monitoring namespace once it exists (ArgoCD will create
# it via CreateNamespace=true). These reference the SAME ClusterSecretStore
# ("vault-backend") your other ESO ExternalSecrets already use against
# kv/ — no new Vault mount needed, just two new KV paths.
#
# Before applying, write these two secrets into Vault:
#
#   vault kv put kv/monitoring/grafana admin-user=admin admin-password=<generate one>
#   vault kv put kv/monitoring/discord webhook_url=<your Discord webhook URL>

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook_url
      remoteRef:
        key: monitoring/discord
        property: webhook_url
# kube-prometheus-stack values for the pi-k8s homelab cluster
# k3s-specific notes are called out inline — this is NOT a stock values.yaml

## ---------------------------------------------------------------
## CRDs are installed OUT OF BAND, not managed by this chart/ArgoCD.
## Reason: the Prometheus Operator CRDs (alertmanagers, prometheuses,
## prometheusagents, scrapeconfigs, thanosrulers, alertmanagerconfigs)
## are large enough that even ArgoCD's ServerSideApply patch attempt
## exceeds the 262144-byte metadata.annotations limit on every sync,
## causing a permanent SyncFailed loop. This is a known, documented
## issue with this chart under GitOps tools (ArgoCD/Flux).
##
## Fix: disable the chart's own CRD management, and install/update
## CRDs manually instead:
##
##   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
##   helm repo update
##   helm show crds prometheus-community/kube-prometheus-stack --version 65.5.1 \
##     | kubectl apply --server-side --force-conflicts -f -
##
## Re-run that command whenever bumping targetRevision in
## kube-prometheus-stack-app.yaml, BEFORE syncing the Application.
## ---------------------------------------------------------------
crds:
  enabled: false

## k3s embeds kube-scheduler, kube-controller-manager, and kube-proxy
## inside the single `k3s server` process (confirmed: PID running as
## `/usr/local/bin/k3s server` on pi5-1). There are no separate pods/
## services for these, so the chart's default ServiceMonitors for them
## will sit in permanent failure. Disable them explicitly.
## ---------------------------------------------------------------
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

## etcd IS scrapeable, but only after you expose it — see README.md
## step "Enable etcd metrics on pi5-1" before this ServiceMonitor will
## actually return data. pi5-1 is your sole control-plane/etcd node.
kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.0.151 # TODO: replace with pi5-1's actual IP
  service:
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http
    insecureSkipVerify: true

## node-exporter runs on every node — good, this is how you get
## per-node memory/CPU (the pi5-1 74% memory number you saw via
## `kubectl top nodes`) into Grafana with history + alerting.
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

## ---------------------------------------------------------------
## Prometheus
## ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          # TODO: confirm this matches your actual StorageClass name —
          # run `kubectl get storageclass` and adjust if different
          storageClassName: nfs-client
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # additionalScrapeConfigs could go here later if you add scrape
    # targets kube-prometheus-stack doesn't auto-discover (e.g. Vault,
    # AWX, cinextma) — leaving this out for now, first get core metrics
    # flowing before adding app-level scraping.

## ---------------------------------------------------------------
## Alertmanager -> Discord
## Webhook URL is pulled from Vault via ESO, matching your existing
## kv/ -> vault-backend pattern. See README.md for the ExternalSecret.
## ---------------------------------------------------------------
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    externalUrl: "https://alertmanager.naidu72.info"
    ## v1alpha1 AlertmanagerConfig uses the legacy selector-based routing
    ## model: matched AlertmanagerConfig objects are inserted as CHILD
    ## routes under the base config's root route, and by default the
    ## operator auto-injects a `namespace: <config's namespace>` matcher
    ## on that child route. Since most of our alerts (node, etcd, pod)
    ## carry a `namespace` label that ISN'T "monitoring", that default
    ## matcher would silently swallow them. `type: None` disables the
    ## auto-injection so the discord AlertmanagerConfig below actually
    ## catches everything, not just monitoring-namespace alerts.
    alertmanagerConfigMatcherStrategy:
      type: None
    ## Matches ANY AlertmanagerConfig object in the monitoring namespace
    ## (the default kube-prometheus-stack behavior — explicit here for
    ## clarity since we're relying on it).
    alertmanagerConfigSelector: {}
  ## Base/root config — deliberately minimal. This exists only to give
  ## Alertmanager a valid root route + fallback receiver; the ACTUAL
  ## discord routing lives in the AlertmanagerConfig CRD below, since
  ## the operator's raw-config parser does NOT support webhook_url_file
  ## for discord_configs (confirmed via operator logs: "failed to
  ## initialize from secret: no discord webhook URL provided" — it
  ## only accepts an inline webhook_url in this raw config path).
  config:
    global: {}
    route:
      receiver: "null"
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"

## AlertmanagerConfig CRD (v1alpha1) handles the real discord routing.
## Pulls the webhook URL straight from the discord-webhook Secret via
## secretKeyRef — no file mount, no operator config-parsing gap.
extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: homelab-discord
      namespace: monitoring
    spec:
      route:
        receiver: discord
        groupBy: ["alertname", "severity"]
        groupWait: 30s
        groupInterval: 5m
        repeatInterval: 4h
      receivers:
        - name: discord
          discordConfigs:
            - apiURL:
                name: discord-webhook
                key: webhook_url

## ---------------------------------------------------------------
## Grafana — ingress via Cloudflare Tunnel, matching the pattern used
## by argocd/awx/cinextma/adguard/n8n/vault: no cert-manager/TLS block
## needed since Cloudflare terminates TLS at the edge and the tunnel
## carries plain HTTP to the backend (port 80 only, same as your
## other cloudflare-tunnel ingresses).
## ---------------------------------------------------------------
grafana:
  enabled: true
  defaultDashboardsEnabled: true
  ingress:
    enabled: true
    ingressClassName: cloudflare-tunnel
    hosts:
      - grafana.naidu72.info
  ## Admin password pulled from Vault via ESO instead of the chart's
  ## auto-generated random secret — see README.md.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

## ---------------------------------------------------------------
## Baseline alert rules — start conservative, tune thresholds after
## a week of watching real data rather than guessing up front.
## ---------------------------------------------------------------
additionalPrometheusRulesMap:
  homelab-rules:
    groups:
      - name: homelab.node.rules
        rules:
          - alert: HomelabNodeMemoryHigh
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} memory usage above 85%"
              description: "Sustained high memory pressure — pi5-1 running control-plane + etcd is the one to watch first."

          - alert: HomelabNodeMemoryCritical
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} memory usage above 95%"

      - name: homelab.etcd.rules
        rules:
          - alert: HomelabEtcdInsufficientMembers
            expr: count(up{job="kube-etcd"} == 1) < ((count(up{job="kube-etcd"}) + 1) / 2)
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "etcd cluster has lost quorum"
              description: "Directly relevant to your rock64/pi5-1 etcd quorum history — page immediately."

          - alert: HomelabEtcdDown
            expr: up{job="kube-etcd"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "etcd on {{ $labels.instance }} is down"

      - name: homelab.pod.rules
        rules:
          - alert: HomelabPodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"

      - name: homelab.pvc.rules
        rules:
          - alert: HomelabPVCAlmostFull
            expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free space"
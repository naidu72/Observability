name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments: disable, comments-indentation: disable}}" .

  helm-template:
    runs-on: ubuntu-latest
    needs: yamllint
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Add prometheus-community repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Extract chart version from Application manifest
        id: chart_version
        run: |
          VERSION=$(grep -A2 "chart: kube-prometheus-stack" apps/kube-prometheus-stack-app.yaml | grep targetRevision | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: helm template (dry-run render)
        run: |
          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "${{ steps.chart_version.outputs.version }}" \
            --namespace monitoring \
            -f charts/kube-prometheus-stack/values.yaml \
            --output-dir /tmp/rendered

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/rendered
          retention-days: 7

  kubeconform:
    runs-on: ubuntu-latest
    needs: helm-template
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Add prometheus-community repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Extract chart version from Application manifest
        id: chart_version
        run: |
          VERSION=$(grep -A2 "chart: kube-prometheus-stack" apps/kube-prometheus-stack-app.yaml | grep targetRevision | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Render chart
        run: |
          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "${{ steps.chart_version.outputs.version }}" \
            --namespace monitoring \
            -f charts/kube-prometheus-stack/values.yaml \
            > /tmp/rendered-all.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered manifests
        run: |
          # -ignore-missing-schemas: covers CRDs like PrometheusRule/ServiceMonitor
          # that aren't part of core k8s schemas
          kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered-all.yaml

      - name: Validate ArgoCD Application manifests
        run: |
          # ArgoCD Application/ExternalSecret CRDs aren't in the standard
          # schema catalog either — same relaxed mode applies here
          kubeconform -strict -ignore-missing-schemas -summary \
            bootstrap/root-app.yaml \
            apps/kube-prometheus-stack-app.yaml \
            apps/monitoring-secrets.yaml